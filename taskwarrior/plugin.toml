# Taskwarrior — quick capture on the bar, backed by the `task` CLI.
# Click the glyph to toggle a panel: type a task and press Enter, or scan
# what is still pending and tick things off. The bar widget polls
# `task status:pending -WAITING export` every two seconds.
id = "lpzchr/taskwarrior"
name = "Taskwarrior"
version = "0.2.0"
plugin_api = 24
author = "lpzchr"
license = "MIT"
dependencies = ["taskwarrior"]
tags = ["bar", "panel", "productivity"]
icon = "checklist"
description = "Quick task capture and a pending-task list, backed by Taskwarrior."

# Plugin-level settings: which task binary, rc file, and data directory the
# plugin talks to. Empty rc/data settings inherit Taskwarrior's own defaults
# (usually ~/.taskrc and its data.location).
[[setting]]
key = "task_binary"
type = "string"
label_key = "settings.task_binary.label"
description_key = "settings.task_binary.description"
default = "task"

[[setting]]
key = "task_rc"
type = "file"
label_key = "settings.task_rc.label"
description_key = "settings.task_rc.description"
default = ""

[[setting]]
key = "task_data_dir"
type = "folder"
label_key = "settings.task_data_dir.label"
description_key = "settings.task_data_dir.description"
default = ""

# Tags applied to a captured task when the typed line names none itself.
[[setting]]
key = "default_tags"
type = "string"
label_key = "settings.default_tags.label"
description_key = "settings.default_tags.description"
default = "inbox"

[[setting]]
key = "sort_order"
type = "select"
label_key = "settings.sort_order.label"
description_key = "settings.sort_order.description"
default = "urgency"
options = [
  { value = "urgency", label_key = "settings.sort_order.urgency" },
  { value = "newest", label_key = "settings.sort_order.newest" },
  { value = "oldest", label_key = "settings.sort_order.oldest" },
  { value = "alpha", label_key = "settings.sort_order.alpha" },
]

# Filter chips offered above the list, as a comma-separated list of
# Taskwarrior filter expressions. Empty hides the chip row.
[[setting]]
key = "saved_filters"
type = "string"
label_key = "settings.saved_filters.label"
description_key = "settings.saved_filters.description"
default = "+inbox, +next, due.before:tomorrow"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = 620
placement = "attached"
open_near_click = true
# The panel is a capture box: it needs the keyboard the moment it opens.
keyboard_focus = "exclusive"

[[widget]]
id = "todo"
entry = "todo.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "checklist"
